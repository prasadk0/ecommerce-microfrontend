<div class="forgot-password-page">

  <div class="forgot-password-card">

    <div
      class="forgot-password-icon"
      aria-hidden="true"
    >
      <i class="pi pi-lock"></i>
    </div>

    <ng-container *ngIf="!emailSent">

      <div class="page-header">

        <h1>
          {{ revampFallback().PAGE.TITLE }}
        </h1>

        <p>
          {{ revampFallback().PAGE.DESCRIPTION }}
        </p>

      </div>

      <form
        [formGroup]="forgotPasswordForm"
        (ngSubmit)="sendResetLink()"
        novalidate
      >

        <div class="form-field">

          <label for="email">
            {{ revampFallback().FIELDS.EMAIL.LABEL }}
          </label>

          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            [placeholder]="
              revampFallback().FIELDS.EMAIL.PLACEHOLDER
            "
            autocomplete="email"
            [class.invalid]="isInvalid('email')"
          />

          <small
            class="error-message"
            *ngIf="
              getControl('email')?.hasError('required') &&
              isInvalid('email')
            "
          >
            {{ revampFallback().VALIDATION.EMAIL_REQUIRED }}
          </small>

          <small
            class="error-message"
            *ngIf="
              getControl('email')?.hasError('email') &&
              isInvalid('email')
            "
          >
            {{ revampFallback().VALIDATION.EMAIL_INVALID }}
          </small>

        </div>

        <button
          type="submit"
          pButton
          class="send-link-button"
        >
          {{ revampFallback().ACTIONS.SEND_LINK }}
        </button>

      </form>

      <button
        type="button"
        class="back-login-button"
        (click)="backToLogin()"
      >
        <i class="pi pi-arrow-left"></i>

        <span>
          {{ revampFallback().ACTIONS.BACK_TO_LOGIN }}
        </span>
      </button>

    </ng-container>


    <!-- SUCCESS STATE -->

    <ng-container *ngIf="emailSent">

      <div class="success-state">

        <div
          class="success-icon"
          aria-hidden="true"
        >
          <i class="pi pi-check"></i>
        </div>

        <h1>
          {{ revampFallback().SUCCESS.TITLE }}
        </h1>

        <p>
          {{ revampFallback().SUCCESS.MESSAGE }}
        </p>

        <button
          type="button"
          pButton
          class="send-link-button"
          (click)="backToLogin()"
        >
          {{ revampFallback().ACTIONS.BACK_TO_LOGIN }}
        </button>

      </div>

    </ng-container>

  </div>

</div>
